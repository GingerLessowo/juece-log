<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="决策记录">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>决策记录</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f3f5;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --line: #e5e6eb;
    --focus: #4a7dff;
    --do: #17994f;
    --do-bg: #e8f5ee;
    --do-bg-h: #d9eee2;
    --skip: #d03050;
    --skip-bg: #fdeef1;
    --skip-bg-h: #f9dde2;
    --warn-bg: #fff7e6;
    --warn-line: #f0d9a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    justify-content: center;
    padding: 26px 16px 72px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; }
  .card { background: var(--card); border-radius: 14px; margin-bottom: 14px; }

  input { font-family: inherit; font-size: 14px; color: var(--text); background: transparent; border: 0; outline: 0; width: 100%; }

  #warn {
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px;
    color: #8a6d1a;
    margin-bottom: 14px;
  }

  /* ---- 录入区 ---- */
  .entry { padding: 18px 20px 14px; }
  .entry .row { display: flex; gap: 8px; }
  .entry input.thought {
    flex: 1; min-width: 0; width: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: #fff;
    font-size: 14.5px;
    transition: border-color .12s;
  }
  .entry input.thought:focus { border-color: var(--focus); }
  .entry .v {
    flex: none;
    border: 0; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 0 14px; cursor: pointer;
    transition: background .12s, transform .1s, opacity .12s;
  }
  .entry .v:active { transform: scale(.98); }
  .entry .v.do { background: var(--do-bg); color: var(--do); }
  .entry .v.do:hover { background: var(--do-bg-h); }
  .entry .v.skip { background: var(--skip-bg); color: var(--skip); }
  .entry .v.skip:hover { background: var(--skip-bg-h); }
  .entry .v:disabled { opacity: .45; cursor: default; }
  .entry .v:disabled:hover { background: var(--do-bg); }
  .entry .v.skip:disabled:hover { background: var(--skip-bg); }
  .entry .state { text-align: center; color: var(--muted); font-size: 12.5px; padding-top: 10px; }

  /* ---- 搜索 ---- */
  .search input {
    display: block;
    padding: 11px 20px;
    border-radius: 14px;
    font-size: 13.5px;
  }
  .search input::placeholder { color: var(--muted); }

  /* ---- 列表 ---- */
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 20px 9px; color: var(--muted); font-size: 13px;
  }
  ul { list-style: none; }
  .rec {
    padding: 12px 20px 13px;
    border-top: 1px solid var(--line);
  }
  .rec.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { background: #eef3ff; } to { background: transparent; } }
  .rec .top { display: flex; align-items: center; gap: 8px; }
  .vd {
    flex: none;
    border: 0; border-radius: 7px;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 2px 9px; cursor: pointer;
    transition: background .12s;
  }
  .vd.do { background: var(--do-bg); color: var(--do); }
  .vd.do:hover { background: var(--do-bg-h); }
  .vd.skip { background: var(--skip-bg); color: var(--skip); }
  .vd.skip:hover { background: var(--skip-bg-h); }
  .rec .date { flex: 1; text-align: right; font-size: 12.5px; color: var(--muted); }
  .rec .del {
    flex: none;
    border: 0; background: transparent; border-radius: 7px;
    font-family: inherit; font-size: 14px; color: #c9cdd4;
    padding: 0 6px; cursor: pointer;
    transition: color .12s, background .12s;
  }
  .rec .del:hover { background: #f2f3f5; color: var(--skip); }
  .rec .thought { margin-top: 7px; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .rec .reason {
    margin-top: 5px; font-size: 13px; line-height: 1.5;
    color: #4e5969; cursor: text; overflow-wrap: anywhere;
    transition: color .12s;
  }
  .rec .reason.blank { color: var(--muted); }
  .rec .reason:hover { color: var(--focus); }
  .rec input.reason-input {
    display: block; width: 100%;
    margin-top: 5px;
    border: 1px solid var(--focus);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 13px;
    background: #fff;
  }
  .no-match { padding: 26px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  .empty { padding: 30px 22px 36px; text-align: center; color: var(--muted); font-size: 13.5px; line-height: 2; }

  /* ---- 底部工具条 ---- */
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .btn:hover { border-color: #c9cdd4; background: #f7f8fa; }
  .toolbar .btn { font-size: 12.5px; padding: 6px 11px; }

  /* ---- 撤销条 ---- */
  #undo {
    position: fixed; left: 50%; bottom: 26px;
    transform: translate(-50%, 12px);
    background: #1f2329; color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 999px;
    display: flex; align-items: center; gap: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    z-index: 40;
    max-width: 90vw;
  }
  #undo.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #undo button { background: none; border: 0; color: #7ea2ff; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; padding: 0; flex: none; }
  #undoText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  [hidden] { display: none !important; }

  /* PWA/移动端适配（由 build.js 注入） */
  html { -webkit-text-size-adjust: 100%; }
  body { padding: calc(20px + env(safe-area-inset-top)) 16px calc(72px + env(safe-area-inset-bottom)); }
  #undo { bottom: calc(26px + env(safe-area-inset-bottom)); }
  @media (max-width: 480px) {
    .entry { padding: 15px 16px 12px; }
    .entry input.thought { font-size: 16px; }
    .entry .v { padding: 0 12px; }
    .search input { font-size: 16px; }
    .rec input.reason-input { font-size: 16px; }
    .rec .del { padding: 4px 10px; }
  }
</style>
</head>
<body>
<main>
  <div id="warn" hidden>本地存储不可用：数据只在本页内存中，关闭页面即丢失。请尽快用「导出备份」留一份。</div>

  <div class="card entry">
    <div class="row">
      <input type="text" id="thought" class="thought" placeholder="要不要做 X…" autocomplete="off">
      <button type="button" class="v do" id="btnDo" disabled>✓ 做</button>
      <button type="button" class="v skip" id="btnSkip" disabled>✕ 不做</button>
    </div>
    <div class="state">点「做」或「不做」定论 · 回车不保存</div>
  </div>

  <div class="card search" id="searchCard" hidden>
    <input type="text" id="q" placeholder="搜索念头 / 理由…" autocomplete="off">
  </div>

  <section class="card" id="listCard" hidden>
    <div class="list-head"><span>决策</span><span id="listCnt"></span></div>
    <ul id="list"></ul>
  </section>

  <div class="card empty" id="empty" hidden>还没有记录。<br>冒出「要不要做 X」的念头时，写下它，点「做」或「不做」定论。</div>

  <div class="toolbar">
    <button type="button" class="btn" id="importBtn">导入备份</button>
    <button type="button" class="btn" id="exportBtn">导出备份</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</main>

<div id="undo"><span id="undoText"></span><button type="button" id="undoBtn">撤销</button></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'juece-log-v1';
  var UNDO_MS = 6000;
  var VERDICT_KEYS = ['do', 'skip'];
  var VERDICT_TEXT = { do: '✓ 做', skip: '✕ 不做' };
  var VERDICT_PLAIN = { do: '做', skip: '不做' };

  var state = { records: [] };
  var query = '';
  var undoAction = null;
  var undoTimer = null;
  var editing = null;

  function $(id) { return document.getElementById(id); }

  /* ---------- 存储 ---------- */
  /* 结论是每条的主心骨（本工具没有「待定」态），坏值不留；理由属旁支，坏值归一为空 */
  function validRec(r) {
    return r && typeof r === 'object'
      && typeof r.id === 'string' && r.id
      && typeof r.thought === 'string' && r.thought.trim() !== ''
      && typeof r.ts === 'number' && isFinite(r.ts)
      && VERDICT_KEYS.indexOf(r.verdict) !== -1;
  }

  function normalizeRec(r) {
    return {
      id: r.id,
      ts: r.ts,
      thought: r.thought.trim(),
      verdict: r.verdict,
      reason: typeof r.reason === 'string' ? r.reason : ''
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return [];
      return Array.isArray(data.records) ? data.records.filter(validRec).map(normalizeRec) : [];
    } catch (err) {
      console.error('读取存储失败，按空数据启动', err);
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: 1, records: state.records }));
    } catch (err) {
      console.error('保存失败', err);
      $('warn').hidden = false;
    }
  }

  /* ---------- 日期 ---------- */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function dayKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function dateText(ts) {
    var d = new Date(ts), now = new Date();
    var k = dayKey(ts);
    if (k === dayKey(now.getTime())) return '今天';
    if (k === dayKey(now.getTime() - 86400000)) return '昨天';
    return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function fullTimeText(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ---------- 工具 ---------- */
  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function findRec(id) {
    for (var i = 0; i < state.records.length; i++) {
      if (state.records[i].id === id) return { idx: i, rec: state.records[i] };
    }
    return null;
  }

  function shortText(s) { return s.length > 16 ? s.slice(0, 16) + '…' : s; }

  function flashRec(id) {
    var li = document.querySelector('.rec[data-id="' + id + '"]');
    if (li) li.classList.add('flash');
  }

  function sortedDesc() {
    return state.records.slice().sort(function (a, b) { return b.ts - a.ts; });
  }

  function matches(rec) {
    if (!query) return true;
    return rec.thought.toLowerCase().indexOf(query) !== -1
      || rec.reason.toLowerCase().indexOf(query) !== -1;
  }

  /* ---------- 渲染 ---------- */
  function buildBadge(rec) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'vd ' + rec.verdict;
    b.dataset.flip = rec.id;
    b.textContent = VERDICT_TEXT[rec.verdict];
    b.title = '点击改为「' + VERDICT_PLAIN[rec.verdict === 'do' ? 'skip' : 'do'] + '」';
    return b;
  }

  function buildReasonEl(rec) {
    var r = document.createElement('div');
    r.className = 'reason' + (rec.reason ? '' : ' blank');
    r.dataset.reason = rec.id;
    r.title = '点击' + (rec.reason ? '修改' : '写') + '理由';
    r.textContent = rec.reason ? '理由：' + rec.reason : '＋写理由';
    return r;
  }

  function buildRow(rec) {
    var li = document.createElement('li');
    li.className = 'rec';
    li.dataset.id = rec.id;

    var top = document.createElement('div');
    top.className = 'top';
    top.appendChild(buildBadge(rec));

    var date = document.createElement('span');
    date.className = 'date';
    date.textContent = dateText(rec.ts);
    date.title = fullTimeText(rec.ts);
    top.appendChild(date);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.dataset.del = rec.id;
    del.title = '删除';
    del.textContent = '×';
    top.appendChild(del);

    var thought = document.createElement('div');
    thought.className = 'thought';
    thought.textContent = rec.thought;

    li.appendChild(top);
    li.appendChild(thought);
    li.appendChild(buildReasonEl(rec));
    return li;
  }

  function renderAll() {
    editing = null;

    var total = state.records.length;
    $('searchCard').hidden = total === 0;
    $('empty').hidden = total !== 0;
    $('listCard').hidden = total === 0;

    var items = sortedDesc().filter(matches);
    var list = $('list');
    list.textContent = '';
    items.forEach(function (r) { list.appendChild(buildRow(r)); });
    if (total && !items.length) {
      var li = document.createElement('li');
      li.className = 'no-match';
      li.textContent = '没有匹配的记录';
      list.appendChild(li);
    }
    $('listCnt').textContent = total ? (query ? '命中 ' + items.length + ' / ' + total : total + ' 条') : '';
  }

  function refreshAdd() {
    var has = $('thought').value.trim() !== '';
    $('btnDo').disabled = !has;
    $('btnSkip').disabled = !has;
  }

  /* ---------- 新增 ---------- */
  function addRecord(verdict) {
    var thought = $('thought').value.trim();
    if (!thought) return;
    if (query) { query = ''; $('q').value = ''; }

    var rec = { id: genId(), ts: Date.now(), thought: thought, verdict: verdict, reason: '' };
    state.records.push(rec);
    save();
    $('thought').value = '';
    refreshAdd();
    renderAll();
    flashRec(rec.id);
    showUndo('已记下「' + VERDICT_PLAIN[verdict] + '」：' + shortText(thought), function () {
      var hit = findRec(rec.id);
      if (hit) state.records.splice(hit.idx, 1);
      save();
      renderAll();
    });
    openReasonEdit(rec.id);
  }

  /* ---------- 改主意：点徽标翻转 ---------- */
  function flipVerdict(id) {
    var hit = findRec(id);
    if (!hit) return;
    var before = hit.rec.verdict;
    hit.rec.verdict = before === 'do' ? 'skip' : 'do';
    save();
    paintBadge(id, hit.rec);
    flashRec(id);
    showUndo('已改为「' + VERDICT_PLAIN[hit.rec.verdict] + '」：' + shortText(hit.rec.thought), function () {
      hit.rec.verdict = before;
      save();
      paintBadge(id, hit.rec);
      flashRec(id);
    });
  }

  function paintBadge(id, rec) {
    var row = document.querySelector('.rec[data-id="' + id + '"]');
    if (!row) return;
    var old = row.querySelector('.vd');
    if (old) old.parentNode.replaceChild(buildBadge(rec), old);
  }

  /* ---------- 理由：就地补写 ---------- */
  function openReasonEdit(id) {
    if (editing) return;
    var hit = findRec(id);
    if (!hit) return;
    var row = document.querySelector('.rec[data-id="' + id + '"]');
    if (!row) return;
    var el = row.querySelector('[data-reason]');
    if (!el) return;

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'reason-input';
    input.value = hit.rec.reason || '';
    input.placeholder = '写一句理由：为什么这么定？';
    el.parentNode.replaceChild(input, el);

    editing = { id: id, input: input };
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}

    input.addEventListener('blur', function () { commitReason(true); });
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commitReason(true); }
      else if (ev.key === 'Escape') { ev.stopPropagation(); commitReason(false); }
    });
  }

  function commitReason(saveIt) {
    var ed = editing;
    if (!ed) return;
    editing = null;
    var hit = findRec(ed.id);
    if (hit && saveIt) {
      var val = ed.input.value.trim();
      if (hit.rec.reason !== val) { hit.rec.reason = val; save(); }
    }
    if (ed.input.parentNode) {
      ed.input.parentNode.replaceChild(buildReasonEl(hit ? hit.rec : { id: ed.id, reason: '' }), ed.input);
    }
  }

  /* ---------- 删除 ---------- */
  function doDelete(id) {
    var hit = findRec(id);
    if (!hit) return;
    if (editing && editing.id === id) editing = null;
    var removed = state.records.splice(hit.idx, 1)[0];
    save();
    renderAll();
    showUndo('已删除：' + shortText(removed.thought), function () {
      state.records.push(removed);
      save();
      renderAll();
      flashRec(removed.id);
    });
  }

  /* ---------- 撤销条 ---------- */
  function showUndo(text, fn) {
    undoAction = fn;
    $('undoText').textContent = text;
    $('undo').classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndo, UNDO_MS);
  }

  function hideUndo() {
    undoAction = null;
    clearTimeout(undoTimer);
    $('undo').classList.remove('show');
  }

  $('undoBtn').addEventListener('click', function () {
    if (!undoAction) return;
    var fn = undoAction;
    hideUndo();
    fn();
  });

  /* ---------- 导出 / 导入 ---------- */
  function exportJSON() {
    var now = new Date();
    var ymd = now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate());
    var data = { v: 1, exportedAt: now.toISOString(), records: state.records };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '决策记录备份-' + ymd + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }

  $('exportBtn').addEventListener('click', exportJSON);
  $('importBtn').addEventListener('click', function () { $('importFile').click(); });

  $('importFile').addEventListener('change', function () {
    var input = this;
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      input.value = '';
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (err) {
        alert('导入失败：文件不是有效的 JSON');
        return;
      }
      if (!data || typeof data !== 'object' || !Array.isArray(data.records)) {
        alert('导入失败：不像是本工具的备份文件（缺少 records）');
        return;
      }
      var records = data.records.filter(validRec).map(normalizeRec);
      var ok = confirm('将用备份覆盖当前全部数据（现有 ' + state.records.length + ' 条 → 备份 ' + records.length + ' 条），确定？');
      if (!ok) return;
      state.records = records;
      save();
      query = '';
      $('q').value = '';
      renderAll();
      alert('已导入 ' + records.length + ' 条决策');
    };
    reader.readAsText(f);
  });

  /* ---------- 事件 ---------- */
  $('btnDo').addEventListener('click', function () { addRecord('do'); });
  $('btnSkip').addEventListener('click', function () { addRecord('skip'); });
  $('thought').addEventListener('input', refreshAdd);
  $('thought').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') ev.preventDefault();
  });

  $('q').addEventListener('input', function () {
    query = this.value.trim().toLowerCase();
    renderAll();
  });

  $('q').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    ev.stopPropagation();
    if (this.value) { this.value = ''; query = ''; renderAll(); }
    else this.blur();
  });

  document.addEventListener('click', function (ev) {
    var del = ev.target.closest('[data-del]');
    if (del) { doDelete(del.dataset.del); return; }
    var flip = ev.target.closest('[data-flip]');
    if (flip) { flipVerdict(flip.dataset.flip); return; }
    var reason = ev.target.closest('[data-reason]');
    if (reason) openReasonEdit(reason.dataset.reason);
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var tagName = t && t.tagName;
    var typing = tagName === 'INPUT' || tagName === 'TEXTAREA';

    if (ev.key === 'Escape') {
      if (typing) { t.blur(); return; }
      hideUndo();
      return;
    }
    if (typing) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === 'Enter' && tagName === 'BUTTON') ev.preventDefault();
  });

  /* ---------- 启动 ---------- */
  state.records = load();
  renderAll();
  refreshAdd();
})();
